<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pianoizer</title>
  <link rel="stylesheet" href="/static/style.css?v=__ASSET_VER__" />
</head>
<body>
  <main class="wrap">
    <h1>Pianoizer</h1>
    <p class="tag">Turn a song into a piano falling-notes video.</p>

    <form id="job-form" class="card">
      <label class="field">
        <span>YouTube URL or file path</span>
        <input id="source" name="source" type="text"
               placeholder="https://www.youtube.com/watch?v=..." />
      </label>

      <div id="dropzone" class="dropzone" tabindex="0" role="button"
           aria-label="Drop an audio, MIDI, or video file here to upload">
        <svg class="dz-icon" viewBox="0 0 24 24" width="28" height="28"
             aria-hidden="true" focusable="false">
          <path fill="currentColor"
            d="M12 3l4 4h-3v6h-2V7H8l4-4zM5 15v4h14v-4h2v4a2 2 0
               0 1-2 2H5a2 2 0 0 1-2-2v-4h2z" />
        </svg>
        <span class="dz-text">Drag &amp; drop an audio/MIDI/video file, or
          <label class="dz-browse" for="file">browse</label>
        </span>
        <input id="file" name="file" type="file" class="dz-input"
               accept="audio/*,.mid,.midi,video/*" />
        <span id="filename" class="dz-filename" aria-live="polite"></span>
      </div>

      <div class="row">
        <label class="field small">
          <span>FPS</span>
          <input id="fps" name="fps" type="number" min="1" max="120" value="30" />
        </label>
      </div>

      <div class="row checks">
        <label><input id="hands" type="checkbox" /> Colour hands (L/R)</label>
        <label><input id="key_tempo" type="checkbox" /> Show key &amp; tempo</label>
        <label><input id="separate" type="checkbox" /> Separate stems</label>
      </div>

      <button id="start" type="submit">Start</button>
      <span id="err" class="err" role="alert" aria-live="assertive"></span>
    </form>

    <section class="card">
      <div class="jobs-head">
        <h2>Jobs</h2>
        <button id="clear-finished" type="button" class="ghost">Clear finished</button>
      </div>
      <p id="empty" class="empty">No jobs yet.</p>
      <ul id="jobs" class="jobs"></ul>
    </section>
  </main>
  <script src="/static/app.js?v=__ASSET_VER__"></script>
</body>
</html>
