[project]
name = "pianoizer"
version = "0.0.1"
description = "Turn a YouTube song into a piano falling-notes learning video."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "yt-dlp>=2024.0.0",
    "pretty_midi>=0.2.10",
    "mido>=1.3.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "tyro>=0.8.0",
    "imageio-ffmpeg>=0.5.0",
]

# Heavy / optional ML deps kept separate so the render path installs fast.
[project.optional-dependencies]
transcribe = [
    "basic-pitch>=0.3.0",
]
separate = [
    "demucs>=4.0.0",
]

[project.scripts]
pianoizer = "pianoizer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
